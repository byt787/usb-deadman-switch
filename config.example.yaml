# Copy this file to config.yaml and adjust it as needed.
# Alternatively, place it at ~/.config/usb-lock/config.yaml

# What to do when a matching USB removal is detected:
#   "lock"     -> lock the screen (default, safe)
#   "shutdown" -> shut the machine down immediately (DESTRUCTIVE - unsaved
#                 work is lost, use with care)
action: lock

# "any"      -> triggers on ANY USB device removal (mouse, keyboard, stick, ...)
# "specific" -> only triggers when one of the devices listed below is removed
#               (recommended for a "USB key" deadman-switch setup, see README)
mode: any

# Only relevant when mode: specific
# Find vendor_id / product_id e.g. with "lsusb" (Linux) or in the Device
# Manager (Windows, "Hardware IDs" field).
specific_devices:
  - vendor_id: "0781"
    product_id: "5567"

# Only relevant on Windows (Linux uses kernel events, no polling needed).
poll_interval: 1.0

# Delay in seconds between the detected removal and running the action.
lock_delay: 0
