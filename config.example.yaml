# Kopiere diese Datei nach config.yaml und passe sie an.
# Alternativ nach ~/.config/usb-lock/config.yaml legen.

# "any"      -> sperrt bei JEDER USB-Geraete-Entfernung (Maus, Tastatur, Stick, ...)
# "specific" -> sperrt nur, wenn eines der unten gelisteten Geraete entfernt wird
#               (empfohlen fuer einen "USB-Schluessel"-Ansatz, siehe README)
mode: any

# Nur relevant wenn mode: specific
# vendor_id / product_id findest du z.B. mit "lsusb" (Linux) oder im
# Geraete-Manager (Windows, Feld "Hardware-IDs").
specific_devices:
  - vendor_id: "0781"
    product_id: "5567"

# Nur unter Windows relevant (Linux nutzt Kernel-Events, kein Polling noetig).
poll_interval: 1.0

# Wartezeit in Sekunden zwischen erkannter Entfernung und Sperren.
lock_delay: 0
